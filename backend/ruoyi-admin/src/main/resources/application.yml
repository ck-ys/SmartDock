# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  # 基线 8090(批3 按用户指示与 ry.* 脚本/vite proxy 对齐; docker 部署自带 SERVER_PORT 覆盖不受影响)
  port: 8090
  servlet:
    # 应用的访问路径
    context-path: /
  # undertow 配置
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: 1GB
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256

captcha:
  # 是否启用验证码校验
  enable: true
  # 验证码类型 math 数组计算 char 字符验证
  type: math
  # 数字验证码位数
  numberLength: 1
  # 字符验证码长度
  charLength: 4

# 日志配置
logging:
  level:
    org.dromara: @logging.level@
    org.springframework: warn
    org.mybatis.spring.mapper: error
    org.apache.fury: warn
    io.agentscope: warn
  config: classpath:logback-plus.xml

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 50
    # 密码锁定时间（默认10分钟）
    lockTime: 1

# Spring配置
spring:
  application:
    name: RuoYi-Vue-Plus
  ai:
    # DCS AI uses database-backed per-tenant model settings and creates Spring AI models at runtime.
    # Disable Spring AI's default auto-created OpenAI beans so startup does not require a global API key.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  threads:
    # 开启虚拟线程 仅jdk21可用
    virtual:
      enabled: true
  task:
    execution:
      # 从 springboot 3.5 开始 spring自带线程池
      # 不再需要 AsyncConfig与ThreadPoolConfig 可直接注入线程池使用
      thread-name-prefix: async-
      # 由spring自己初始化线程池
      mode: force
    scheduling:
      # @Scheduled 调度线程池（DCS 定时扫描用）；Spring 默认仅 1 线程，这里给到 2 避免与其它调度任务互相阻塞
      thread-name-prefix: schedule-
      pool:
        size: 2
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: @profiles.active@
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 500MB
      # 设置总上传的文件大小
      max-request-size: 500MB
  mvc:
    # 设置静态资源路径 防止所有请求都去查静态资源
    static-path-pattern: /static/**
    format:
      date-time: yyyy-MM-dd HH:mm:ss
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      # 格式化输出
      indent_output: false
      # 忽略无法转换的对象
      fail_on_empty_beans: false
    deserialization:
      # 允许对象忽略json中不存在的属性
      fail_on_unknown_properties: false

# Sa-Token配置
sa-token:
  # token名称 (同时也是cookie名称)
  token-name: Authorization
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: false
  # jwt秘钥
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

# security配置
security:
  # 排除路径
  excludes:
    - /*.html
    - /**/*.html
    - /**/*.css
    - /**/*.js
    - /favicon.ico
    - /error
    - /*/api-docs
    - /*/api-docs/**
    # 业务反馈批1015c Q6：favicon 代理——<img> 标签带不了 sa-token 头，必须匿名可达
    # （controller 已加 IP 限流兜底，miss 一律 404 不泄内容）
    - /dcs/ai/favicon

# 多租户配置
tenant:
  # 是否开启
  enable: true
  # 排除表
  excludes:
    - sys_menu
    - sys_tenant
    - sys_tenant_package
    - sys_role_dept
    - sys_role_menu
    - sys_user_post
    - sys_user_role
    - sys_client
    - sys_oss_config
    - dcs_mission_type
    - dcs_changelog

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 自定义配置 是否全局开启逻辑删除 关闭后 所有逻辑删除功能将失效
  enableLogicDelete: true
  # 多包名使用 例如 org.dromara.**.mapper,org.xxx.**.mapper
  # 批1(2026-10-18): com.smartdock.**.mapper = 自研模块(画像引擎等)的 Mapper 扫描
  mapperPackage: org.dromara.**.mapper,com.smartdock.**.mapper
  # 对应的 XML 文件位置
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: org.dromara.**.domain,com.smartdock.**.domain
  global-config:
    dbConfig:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      idType: ASSIGN_ID

# 数据加密
mybatis-encryptor:
  # 是否开启加密
  enable: true
  # 默认加密算法
  algorithm: BASE64
  # 编码方式 BASE64/HEX。默认BASE64
  encode: BASE64
  # 安全秘钥 对称算法的秘钥 如：AES，SM4
  password:
  # 公私钥 非对称算法的公私钥 如：SM2，RSA
  publicKey:
  privateKey:

# api接口加密
api-decrypt:
  # 是否开启全局接口加密
  enabled: true
  # AES 加密头标识
  headerFlag: encrypt-key
  # 响应加密公钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端解密私钥 
  publicKey: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAJnNwrj4hi/y3CCJu868ghCG5dUj8wZK++RNlTLcXoMmdZWEQ/u02RgD5LyLAXGjLOjbMtC+/J9qofpSGTKSx/MCAwEAAQ==
  # 请求解密私钥 非对称算法的公私钥 如：SM2，RSA 使用者请自行更换
  # 对应前端加密公钥 MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBAKoR8mX0rGKLqzcWmOzbfj64K8ZIgOdHnzkXSOVOZbFu/TJhZ7rFAN+eaGkl3C4buccQd/EjEsj9ir7ijT7h96MCAwEAAQ==
  privateKey: 

springdoc:
  api-docs:
    # 是否开启接口文档
    enabled: true
  info:
    # 标题
    title: '标题：RuoYi-Vue-Plus多租户管理系统_接口文档'
    # 描述
    description: '描述：用于管理集团旗下公司的人员信息,具体包括XXX,XXX模块...'
    # 版本
    version: '版本号: ${project.version}'
    # 作者信息
    contact:
      name: Lion Li
      email: crazylionli@163.com
      url: https://gitee.com/dromara/RuoYi-Vue-Plus
  #这里定义了两个分组，可定义多个，也可以不定义
  group-configs:
    - group: 2.通用模块
      packages-to-scan: org.dromara.web
    - group: 3.系统模块
      packages-to-scan: org.dromara.system
    # 批3-2 U2（拍板 2026-10-10「都按推荐」，范围=仅助手 10 控制器）：助手模块入接口文档
    - group: 6.DCS助手模块
      packages-to-scan: org.dromara.assistant
    # 批1(2026-10-18): 画像引擎模块入接口文档
    - group: 7.画像引擎模块
      packages-to-scan: com.smartdock.profile

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接
  excludeUrls:
    - /system/notice

--- # 分布式锁 lock4j 全局配置
lock4j:
  # 获取分布式锁超时时间，默认为 3000 毫秒
  acquire-timeout: 3000
  # 分布式锁超时: -1 启用 watchdog 自动续期(固定租约在大任务发布>30s时会静默失效)
  expire: -1

--- # Actuator 监控端点的配置项
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: ALWAYS
    logfile:
      external-file: ./logs/sys-console.log

--- # 默认/推荐使用sse推送
sse:
  enabled: true
  path: /resource/sse

--- # websocket
websocket:
  # 如果关闭 需要和前端开关一起关闭
  enabled: false
  # 路径
  path: /resource/websocket
  # 设置访问源地址
  allowedOrigins: '*'

--- # 画像引擎（批1, 2026-10-18）
profile:
  event:
    # 标准事件保留天数; 0=关闭清理。快照是账本永不清理, 事件是原料可老化。
    # 旧展示键 dcs.profile.history-retention-days 必须与此值一致(sys_config 仅展示)。
    retention-days: ${PROFILE_EVENT_RETENTION_DAYS:730}

--- # DCS 定时任务（C2，方案 B：@Scheduled + @Lock4j）
dcs:
  dashboard:
    # 看板 Redis 二级缓存 TTL(秒)：≤0=关闭缓存(验收要即时数据时用 0)，内部钳上限 1h；
    # 只作用于 summary 与 analytics/overview 两个重查询端点(冷 3-4s)，冷端点不入缓存。dspro专审P2-2。
    cache-ttl-seconds: ${DCS_DASHBOARD_CACHE_TTL_SECONDS:180}
  profile:
    embedding:
      # 必须与 dcs_user_profile.embedding 的 vector(N) 一致；后续升级 4096 时同步改 migration 与配置。
      dimensions: ${DCS_PROFILE_EMBEDDING_DIMENSIONS:1024}
      max-similar-limit: ${DCS_PROFILE_EMBEDDING_MAX_SIMILAR_LIMIT:50}
      max-batch-size: ${DCS_PROFILE_EMBEDDING_MAX_BATCH_SIZE:200}
      probes: ${DCS_PROFILE_EMBEDDING_PROBES:10}
  rollout:
    # Security/profile rollout switches. Override with environment variables and restart.
    event-collection-enabled: ${DCS_EVENT_COLLECTION_ENABLED:true}
    l2-enforcement-enabled: ${DCS_L2_ENFORCEMENT_ENABLED:true}
    l34-enforcement-enabled: ${DCS_L34_ENFORCEMENT_ENABLED:true}
    profile-scoring-enabled: ${DCS_PROFILE_SCORING_ENABLED:true}
    ai-adjustment-enabled: ${DCS_AI_ADJUSTMENT_ENABLED:true}
    recalculation-workers-enabled: ${DCS_RECALCULATION_WORKERS_ENABLED:true}
    # 迁移窗口可临时设为 false；稳定运行必须保持 true，禁止回退到可变维度目录。
    strict-published-snapshots-enabled: ${DCS_ROLLOUT_STRICT_PUBLISHED_SNAPSHOTS_ENABLED:true}
    # 风控2.0 内容机审(2026-09-22): 总开关默认 false(新增行为默认关); 开启=四入口机审+记 TASK_CONTENT_RISK 事件
    content-moderation-enabled: ${DCS_CONTENT_MODERATION_ENABLED:false}
    # BLOCK 拦截开关恒默认 false=观察模式(只记事件不拒绝提交); 业务确认误伤率后另行开启
    content-block-enabled: ${DCS_CONTENT_BLOCK_ENABLED:false}
  review:
    # 「责任审核」新建开关。false 时新建 RESPONSIBILITY topic 被拒绝，已有责任审核任务不受影响。默认开启。
    responsibility-enabled: true
    # B4: 审核人健康扫描（检测禁用审核人发告警）
    health-scan:
      enabled: true
      delay-ms: 120000
      initial-delay-ms: 60000
      batch-size: 100
  notice:
    outbox:
      enabled: true
      retry-delay-ms: 30000
      initial-delay-ms: 30000
      max-retry-count: 5
      batch-size: 100
  assistant:
    # 思考内容展示闸（三层第二层，思考链路批 1008 默认改开）：false=服务端丢思考内容帧
    # 只留结构标记（前端仅「正在思考…」占位）；true=思考内容全放行，展示分层交前端
    # 「过程显示」偏好。运维全局关停用（如带宽紧张），默认 true
    reasoning-display:
      enabled: ${DCS_ASSISTANT_REASONING_DISPLAY:true}
  schedule:
    # 总开关：false 时定时扫描跳过（手动触发接口仍可用）
    enabled: true
    # 扫描间隔（毫秒），默认 10 分钟
    scan-delay-ms: 600000
    # 启动后首次扫描延迟（毫秒），默认 1 分钟，给应用预热
    scan-initial-delay-ms: 60000
    # 截止前提醒的提前量（小时），endTime 落在 [now, now+lead] 触发 DEADLINE
    reminder-lead-hours: 24

# AgentScope AGUI 助手配置（批A A3 定版，2026-10-03；四拍板+思考三层设计的 yml 层）
agentscope:
  agui:
    # 记忆由服务端按 threadId 管理（前端不回传历史，防伪造+减载荷）
    server-side-memory: true
    # 思考数据放行到服务端（三层第一层恒开）；内容帧由 AssistantEventEnricher 按闸过滤（第二层）
    enable-reasoning: true
    # token 用量事件=批D 计费数据源
    emit-token-usage: true
    # 断线不中断运行（HITL 恢复链前提，P0 T4 实证默认 true 会打断在途执行）
    interrupt-on-disconnect: false
    # 会话超时 60 分钟（悬浮球问答场景，低于默认 30 不够长思考+工具链）
    session-timeout-minutes: 60
    # 默认 agent 钉死（不带 agentId 的请求也路由到 dcs-assistant）
    default-agent-id: dcs-assistant
