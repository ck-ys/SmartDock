# SmartDock 前端网关（等保加固口径，改自 DCS 交付版，批7 清洗）
server_tokens off;

# 登录接口限流（防暴力破解）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/s;
limit_req_status 429;
error_page 429 = @login_throttled;

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 安全响应头（always 确保代理响应/错误页也带）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: http: https:; media-src 'self' http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' http: https:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # 请求方法白名单（拒绝 TRACE/TRACK 等探测方法）
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # 慢速攻击防护
    client_body_timeout   30s;
    client_header_timeout 15s;

    # 调试端点全站拦截
    location ~* ^/prod-api/(v3/api-docs|swagger-ui|druid|actuator)([/.]|$) {
        return 404;
    }

    # 业务 API：/prod-api 前缀剥掉后转发后端；SSE(AI 助手流式) 关缓冲直通
    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 公开采集口（行为分析 SDK 上报）：只放行 collect 这一个免登端点，
    # /analytics/ 下的管理端点（site/create、simulate 等）一律不在这里暴露
    # （数据接入页生成的接入代码默认指向 location.origin + /analytics/collect）
    location = /analytics/collect {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 公开口限流按 IP 计数：XFF 用真实直连 IP 覆盖而非追加，防客户端自带 XFF 伪造绕过限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 登录接口单独限流
    location = /prod-api/auth/login {
        limit_req zone=login_limit burst=20 nodelay;
        proxy_pass http://backend:8080/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location @login_throttled {
        default_type application/json;
        return 429 '{"code":429,"msg":"操作过于频繁，请稍后再试"}';
    }

    # 前端静态资源（history 路由回退 index.html）
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
